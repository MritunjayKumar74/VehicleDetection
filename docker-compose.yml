services:
  mongo:
    image: mongo:7
    container_name: vehicle_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    command: mongod --quiet
    logging:
      driver: "none"

  backend:
    build: ./backend
    container_name: vehicle_backend
    ports:
      - "0.0.0.0:5000:5000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/vehicledb
      - PORT=5000
    depends_on:
      - mongo

  frontend:
    build: ./frontend
    container_name: vehicle_frontend
    ports:
      - "0.0.0.0:3000:3000"
    environment:
      - VITE_API_URL=http://localhost:5000
    depends_on:
      - backend

volumes:
  mongo_data:
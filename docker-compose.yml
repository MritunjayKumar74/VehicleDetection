services:
  # ── DB1: Camera Sightings (MongoDB) ──────────────────────────
  mongo:
    image: mongo:7
    container_name: vehicle_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    command: mongod --quiet
    logging:
      driver: "none"

  # ── DB2: Insurance Records (PostgreSQL) ──────────────────────
  postgres:
    image: postgres:16
    container_name: vehicle_postgres
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: iia
      POSTGRES_PASSWORD: iia123
      POSTGRES_DB: insurancedb
    volumes:
      - pg_data:/var/lib/postgresql/data
    logging:
      driver: "none"

  # ── DB3: RTO Registration (MySQL) ────────────────────────────
  mysql:
    image: mysql:8
    container_name: vehicle_mysql
    environment:
      MYSQL_ROOT_PASSWORD: iia123
      MYSQL_DATABASE: rtodb
      MYSQL_USER: iia
      MYSQL_PASSWORD: iia123
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-piia123"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging:
      driver: "none"

  # ── DB4: Theft Records (MongoDB — separate db) ───────────────
  # Reuses same Mongo container, different database name (theftdb)

  # ── DB5: MOT Reports (PostgreSQL — separate db) ──────────────
  postgres_mot:
    image: postgres:16
    container_name: vehicle_postgres_mot
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: iia
      POSTGRES_PASSWORD: iia123
      POSTGRES_DB: motdb
    volumes:
      - pg_mot_data:/var/lib/postgresql/data
    logging:
      driver: "none"

  # ── Backend ──────────────────────────────────────────────────
  backend:
    build: ./backend
    container_name: vehicle_backend
    ports:
      - "0.0.0.0:5000:5000"
    environment:
      - PORT=5000

      # MongoDB — DB1 Camera + DB4 Theft
      - MONGO_URI=mongodb://mongo:27017

      # PostgreSQL — DB2 Insurance
      - PG_INSURANCE_HOST=postgres
      - PG_INSURANCE_PORT=5432
      - PG_INSURANCE_USER=iia
      - PG_INSURANCE_PASSWORD=iia123
      - PG_INSURANCE_DB=insurancedb

      # MySQL — DB3 RTO
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=iia
      - MYSQL_PASSWORD=iia123
      - MYSQL_DB=rtodb

      # PostgreSQL — DB5 MOT
      - PG_MOT_HOST=postgres_mot
      - PG_MOT_PORT=5432
      - PG_MOT_USER=iia
      - PG_MOT_PASSWORD=iia123
      - PG_MOT_DB=motdb

    depends_on:
      mongo:
        condition: service_started
      postgres:
        condition: service_started
      mysql:
        condition: service_healthy
      postgres_mot:
        condition: service_started

  # ── Frontend ─────────────────────────────────────────────────
  frontend:
    build: ./frontend
    container_name: vehicle_frontend
    ports:
      - "0.0.0.0:3000:3000"
    environment:
      - VITE_API_URL=http://localhost:5000
    depends_on:
      - backend

volumes:
  mongo_data:
  pg_data:
  pg_mot_data:
  mysql_data:
services:
  mysql:
    image: mysql:8
    container_name: vehicle_mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: iia123
      MYSQL_DATABASE: rtodb
      MYSQL_USER: iia
      MYSQL_PASSWORD: iia123
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-piia123"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging:
      driver: "none"

volumes:
  mysql_data:
